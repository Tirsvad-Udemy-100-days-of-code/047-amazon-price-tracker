<!DOCTYPE html>
<!-- Synthetic example of live Amazon product markup: a coupon span with class a-offscreen comes before the real price, which sits in .a-price. -->
<html lang="en-us">
<head><title>Amazon.com: Instant Pot</title></head>
<body>
<span id="productTitle"> Instant Pot Duo 7-in-1 </span>
<span class="a-size-base"><span class="a-offscreen">Save $5.00 with coupon</span></span>
<span class="a-price a-text-price a-size-medium apexPriceToPay"><span class="a-offscreen">$79.95</span><span aria-hidden="true">$79.95</span></span>
</body>
</html>
